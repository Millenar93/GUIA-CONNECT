<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#123a72" />
    <title>Guia Connect · Caraguatatuba</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="mobile.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <a href="#mapa" class="brand" aria-label="Guia Connect, abrir mapa"
          ><img
            src="assets/guia-connect-logo.jpg"
            alt="Guia Connect — bússola azul"
            width="2048"
            height="768"
        /></a>
        <span class="demo">Versão de demonstração</span>
        <button id="city" aria-label="Selecionar município">
          Caraguatatuba ⌄
        </button>
      </header>
      <main id="app"></main>
      <nav id="nav" aria-label="Navegação principal"></nav>
      <dialog id="dialog"></dialog>
      <div id="overlay-root"></div>
      <div id="toast" role="status"></div>
    </div>
    <script
      src="vendor/leaflet/leaflet.js"
      onerror="window.mapUnavailable = true"
    ></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
